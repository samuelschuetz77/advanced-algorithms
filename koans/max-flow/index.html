<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ee">
  <title>Max Flow · Koans</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="exercise">
      <pre id="code" class="code" hidden></pre>
      <form id="answer-form" autocomplete="off">
        <label class="sr-only" for="answer">Missing word or number</label>
        <div id="sentence" class="sentence"></div>
      </form>
    </div>
    <div id="feedback" class="sr-only" aria-live="polite"></div>
  </main>
  <button id="restart-button" type="button">Restart</button>
  <script src="app.js"></script>
</body>
</html>
